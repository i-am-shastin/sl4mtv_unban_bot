[package]
name = "sl4mtv_unban_bot"
version = "0.9.3"
edition = "2021"
authors = ["i-am-shastin"]

[dependencies]
log = "0.4.22"
log4rs = "1.3.0"
anyhow = "1.0.94"
tokio = { version = "1.42.0", features = ["macros"] }
dotenvy = "0.15.7"
teloxide = { git = "https://github.com/teloxide/teloxide/", features = ["macros", "sqlite-storage-nativetls"] }
serde = "1.0.216"
serde_json = "1.0.133"
chrono = { version = "0.4.39", features = ["serde"] }
strum = { version = "0.26.3", features = ["derive"] }
rand = "0.8.5"
