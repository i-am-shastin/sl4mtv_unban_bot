refresh_rate: 30 seconds
appenders:
  file:
    kind: rolling_file
    path: "logs/unban_bot.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S)} - {l} - {m}{n}"
    policy:
      trigger:
        kind: size
        limit: 10mb
      roller:
        kind: fixed_window
        pattern: "logs/unban_bot.{}.log"
        base: 1
        count: 5
root:
  level: info
  appenders:
    - file